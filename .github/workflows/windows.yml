# 윈도우에서 테스트하고 exe를 묶어 자체 점검까지 돌린다.
# 결과 exe 폴더는 실행 결과 페이지의 Artifacts에서 내려받는다.
#
# v3.0(설계 D34, 4.11): 두 job을 병렬로 돌린다. package는 tests에 기대지 않는다(needs 없음): 테스트 하나가 실패해도
# exe 묶기와 배포본 점검(W2·W3)은 끝까지 돈다.
#   tests   빠른 테스트 전체(W1: 윈도우 글꼴의 실험실 패널, qtbase_ko 번역, 윈도우 spawn의 faulthandler, 뮤텍스)
#   package 자체 점검(uv run) → 처음 실행 안내 10세대(W3) → exe 묶기 → 한글 경로 → 두 exe 자체 점검(새 점검 넷 포함, 안내
#           1세대 초가 기록에 남음) → 학습·판정·재현 → 오류 보고 묶음(evolab-cli.exe report) → exe 자식 세그폴트 기록(W2)
#
# v3.1(설계 4.20): package에 단계를 더하고 release job을 둔다.
#   package exe 파일 버전(3.1.0.0) → 서명 없는 PE 목록 → 서명(비밀 값이 있을 때만, W11) → … v3.0 단계 … → 설치 파일 둘(이번 판,
#           옛 2.99.0 --fast, W4) → 설치 연기 시험(W5) → 휴대용 zip·SHA256SUMS → MF ABI 표(W6) → MF 설치 시도(정보만, W8)
#           → exe 내보내기(W7) → 폰 재생 파일을 헤드리스 Edge로(W9). 설치·내보내기 단계는 앞 단계가 실패해도 그 단계에 필요한 것이
#           있으면 돈다(!cancelled + 앞 단계 결과): v3.0처럼 하나가 실패해도 나머지 배포본 확인은 끝까지 한다.
#   release 태그 v*이고 tests·package가 모두 성공하면 설치 파일·휴대용 zip·SHA256SUMS.txt를 GitHub 릴리스에 올린다(W10).
#           6.2.0: 태그를 밀어 올릴 수 없는 곳에서도 낼 수 있게, 수동 실행(workflow_dispatch)의 release 입력을 켜면 같은 일을 한다.
#           이때 태그 이름은 묶인 프로그램의 버전(v<버전>)이고 그 커밋에 새로 만든다. 같은 버전의 릴리스가 이미 있으면 실패한다.
name: windows

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      release:
        description: "테스트와 묶기가 모두 성공하면 이 커밋을 GitHub 릴리스로 올린다 (태그 v<프로그램 버전>을 새로 만든다)"
        type: boolean
        default: false

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    # v2.0 빠른 테스트가 윈도우에서 1,880개 1,140초(19분)였다. v3.0은 2,300개 남짓이라 리눅스 비율로 어림하면 23분 안팎:
    # 테스트 단계 40분, job 60분. v6.1 출시 실행(43458310517)의 테스트 단계가 30분 23초였고 6.2.0은 테스트 파일이 112 → 148개
    # (얼린 v6.1과 하위 프로세스로 견주는 시험 포함)라 같은 비율이면 40분에 닿는다(어림): 테스트 단계 60분, job 80분.
    timeout-minutes: 80
    env:
      UV_PYTHON_DOWNLOADS: never
      # uv.lock과 pyproject가 어긋나면 sync와 run 모두 실패하게 한다(잠금을 조용히 고치지 않게).
      UV_LOCKED: "1"
      QT_QPA_PLATFORM: offscreen
      # EVOLAB_DATA_DIR는 job 전체에 두지 않는다: paths.ini보다 앞서서 데이터 폴더 설정 테스트가 깨진다(테스트가 스스로 정한다).
    steps:
      # 전체 기록을 받는다: T67(tests/test_structure_learners.py)이 같은 머신에서 v2.0 커밋(4d3e3e6)의 코드를 꺼내
      # 지금 코드와 비교한다(기본 얕은 복제에는 그 커밋이 없어 비교가 빠진다).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Tests
        timeout-minutes: 60
        run: uv run pytest -q

      # tests/test_installer_template.py의 윈도우 CI 설정 검사(W4·W5·W10·W11: release의 needs·if·permissions, 서명 조건,
      # 단계 순서)는 PyYAML이 있어야 돈다. PyYAML은 실행 의존성이 아니라 uv.lock에 없으므로 이 단계에서만 일회용 환경에
      # 얹는다(--with: 잠금 파일은 그대로). 위 단계가 실패해도 돈다.
      - name: Workflow structure tests (PyYAML for this step only)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: uv run --with pyyaml pytest -q tests/test_installer_template.py -k workflow

  package:
    runs-on: windows-latest
    # tests에 기대지 않는다(needs 없음). 자체 점검 둘(uv run, 안내 10세대 약 1분 반) + exe 묶기(약 1분 반) + exe 점검.
    # v3.1: 설치 파일 둘의 압축, 설치 연기 시험(설치된 두 exe 자체 점검 포함), 내보내기, MF 시도가 더해져 120분(어림, 단계마다 따로 상한).
    timeout-minutes: 120
    env:
      UV_PYTHON_DOWNLOADS: never
      UV_LOCKED: "1"
      # 서명 인증서가 저장소 비밀 값에 있는가(W11). 비밀 값 자체는 서명하는 단계의 env로만 넘긴다(다른 단계·자체 점검에 퍼지지 않게).
      # 단계의 if에서는 secrets를 바로 볼 수 없어 job env에 참·거짓만 둔다.
      SIGN_ENABLED: ${{ secrets.SIGN_CERT_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        id: deps
        run: uv sync

      # 뒤 단계(exe 파일 버전, 설치 파일 이름, 연기 시험)가 쓰는 VER. 태그 v*로 돌 때는 태그와 프로그램 버전이 같아야 한다.
      - name: Program version
        shell: pwsh
        run: |
          $v = (uv run python -c "import evolab; print(evolab.__version__)" | Select-Object -Last 1).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { Write-Host "::error::unexpected version '$v'"; exit 1 }
          if ($env:GITHUB_REF -like "refs/tags/v*" -and $env:GITHUB_REF_NAME -ne "v$v") {
            Write-Host "::error::tag $env:GITHUB_REF_NAME does not match the program version $v"; exit 1
          }
          "VER=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version: $v"

      # 새 점검 넷(도움말 쪽, 기록 폴더와 오류 보고 묶음, Qt 한국어, 처음 실행 안내 1세대: 기준 60초)은 데이터·상태 폴더를
      # 임시 폴더로 바꿔 돈다(설계 D5). 안내 줄 「창 → 1세대 재생 n초, 누름 2번」이 설계 M1 값이다.
      - name: Self-test (uv run, real window platform)
        timeout-minutes: 15
        run: uv run evolab selftest --log selftest-dev.log

      # W3: 처음 실행 안내를 4배속으로 10세대까지(창 → 10세대 기준 150초). 초와 1세대·10세대 평균 점수가 기록에 남는다.
      - name: Full tour timing (uv run, 4x to generation 10)
        timeout-minutes: 15
        run: uv run evolab selftest --tour full --log tour-full.log

      # v3.1: 앞의 uv 자체 점검·안내 10세대가 실패해도 exe 묶기와 그 뒤 배포본 점검(exe 자체 점검, 설치 파일, 내보내기)은 돈다
      # (설계 D34의 뜻: 하나가 실패해도 배포본 확인은 끝까지). exe가 있어야 하는 단계는 모두 build 결과를 본다.
      - name: Build exe
        id: build
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: uv run pyinstaller packaging/evolab.spec --noconfirm

      # v3.1 D45: 두 exe의 파일 버전 정보(packaging/version_info.py)가 프로그램 버전 네 칸과 같다.
      - name: Exe file version
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          foreach ($name in @("evolab.exe", "evolab-cli.exe")) {
            $vi = (Get-Item -LiteralPath (Join-Path "dist\evolab" $name)).VersionInfo
            $fixed = "{0}.{1}.{2}.{3}" -f $vi.FileMajorPart, $vi.FileMinorPart, $vi.FileBuildPart, $vi.FilePrivatePart
            "{0}: file version {1}, product version {2}, original name {3}" -f $name, $fixed, $vi.ProductVersion, $vi.OriginalFilename
            if ($fixed -ne "$env:VER.0") { Write-Host "::error::$name file version $fixed is not $env:VER.0"; exit 1 }
            if ($vi.OriginalFilename -ne $name) { Write-Host "::error::$name has the version info of $($vi.OriginalFilename)"; exit 1 }
          }

      # 서명 문서(docs/signing.md)용 개수: 배포본 PE 가운데 Authenticode 서명이 없는 것(정보만).
      - name: Unsigned PE list
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: uv run python packaging/list_unsigned.py dist\evolab

      # W11: 인증서 비밀 값(SIGN_CERT_BASE64)이 없으면 이 단계는 skipped로 남는다. 있으면 PyInstaller 뒤·ISCC 전에 우리 exe 2개와
      # 서명 없는 PE를 모두 서명한다(한글 경로 사본·artifact·설치 파일·휴대용 zip이 모두 서명된 파일을 담는다).
      - name: Sign (only when a certificate is configured)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && env.SIGN_ENABLED == 'true' }}
        shell: pwsh
        env:
          SIGN_CERT_BASE64: ${{ secrets.SIGN_CERT_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
          SIGN_TIMESTAMP_URL: ${{ vars.SIGN_TIMESTAMP_URL }}
        run: ./packaging/installer/sign.ps1 -Dist dist\evolab

      - name: Copy exe folder to a Korean path
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "진화 실험실 테스트"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item -Recurse dist\evolab $dest

      - name: Self-test console exe (evolab-cli.exe)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "진화 실험실 테스트"
          & (Join-Path $dest "evolab\evolab-cli.exe") selftest --log (Join-Path $dest "cli 점검.log")
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Train, judge and reproduce with the console exe (Korean path)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "진화 실험실 테스트"
          $cli = Join-Path $dest "evolab\evolab-cli.exe"
          $envfile = Join-Path $dest "evolab\_internal\environments\lander.evoenv"
          $runs = Join-Path $dest "실행 기록"
          & $cli train $envfile --popsize 8 --trials 2 --max-generations 3 --validate-every 16 --workers 2 --out $runs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $run = (Get-ChildItem $runs | Select-Object -First 1).FullName
          & $cli judge $run --seeds 4 --workers 2
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $zip = Join-Path $dest "재현 묶음.zip"
          & $cli bundle $run --out $zip
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $cli reproduce $zip --out (Join-Path $dest "다시 돌림") --workers 1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # W3(v6.1 자라는 뇌, v6 설계 8.4·9.3 v6.1-2): 같은 exe로 자라는 뇌를 짧게 학습하고(--method grow, 세대마다 자람: 뉴런 2 → 4 → 8 → 16),
      # 재현 묶음을 만들어 다시 돌린 결과가 원래 실행과 같아야 한다(종료 코드 0과 「원래 실행과 같습니다」 줄). 자체 점검 「자라는 뇌」는
      # 워커 없이 학습기만 보므로, 여기서 명령줄 인자(--method grow, --grow-every)·워커 프로세스 2개의 자라는 학습·묶음·재현을 exe로
      # 지나간다. 실행 폴더는 앞 단계의 「실행 기록」과 따로 둔다(앞 단계와 오류 보고 단계가 그 폴더의 첫 실행을 쓴다).
      # exe는 출력이 파이프면 UTF-8로 쓰므로(cli._configure_streams) 받는 쪽 인코딩을 UTF-8로 맞춘 뒤 한글 줄을 찾는다.
      - name: Growing brain train and reproduce with the console exe (Korean path)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "진화 실험실 테스트"
          $cli = Join-Path $dest "evolab\evolab-cli.exe"
          $envfile = Join-Path $dest "evolab\_internal\environments\lander.evoenv"
          $runs = Join-Path $dest "자라는 뇌 기록"
          & $cli train $envfile --method grow --grow-every 1 --popsize 8 --trials 2 --max-generations 4 --validate-every 16 --workers 2 --out $runs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $run = (Get-ChildItem -LiteralPath $runs -Directory | Select-Object -First 1).FullName
          if (-not $run) { Write-Error "no growing run folder"; exit 1 }
          $grown = @(Import-Csv -LiteralPath (Join-Path $run "stats.csv") -Encoding utf8 | Where-Object { $_.grow -eq "1" }).Count
          if ($grown -ne 3) { Write-Error "expected 3 growth rows in stats.csv, got $grown"; exit 1 }
          $zip = Join-Path $dest "자라는 뇌 묶음.zip"
          & $cli bundle $run --out $zip
          if ($LASTEXITCODE -ne 0) { exit 1 }
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $out = & $cli reproduce $zip --out (Join-Path $dest "자라는 뇌 다시 돌림") --workers 1
          $code = $LASTEXITCODE
          $out | ForEach-Object { "$_" }
          if ($code -ne 0) { Write-Error "reproduce exit code $code"; exit 1 }
          if (-not ($out | Select-String -SimpleMatch -Quiet "원래 실행과 같습니다")) {
            Write-Error "reproduce did not print the same-as-original line"; exit 1
          }

      # W2·W3(6.2.0 프리셋 만들기, 설계 6.1·C11): 배포본에 틀(assets\templates\*.evotpl)·조리법(assets\recipes\*.json)·내장 달리기
      # (environments\running.evoenv)가 있고, 콘솔 exe가 조리법으로 만든 달리기(evolab preset running)가 배포본의 running.evoenv와 바이트까지
      # 같으며(T14: 내장 파일 = build(조리법)), 그 파일로 bench가 돈다. 자체 점검 「프리셋」(내장 조리법 전부와 달리기 한 세대)은 앞의
      # 콘솔 exe 자체 점검이 돌렸으므로 그 기록(cli 점검.log)에 통과 줄이 있는지 본다. 경로는 한글·빈칸이 든 변수로만 넘긴다.
      - name: Sports preset files, preset command and bench with the console exe (Korean path)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "진화 실험실 테스트"
          $cli = Join-Path $dest "evolab\evolab-cli.exe"
          $internal = Join-Path $dest "evolab\_internal"
          $templates = @(Get-ChildItem -LiteralPath (Join-Path $internal "assets\templates") -Filter *.evotpl).Count
          $recipes = @(Get-ChildItem -LiteralPath (Join-Path $internal "assets\recipes") -Filter *.json).Count
          "templates: $templates, recipes: $recipes"
          if ($templates -lt 8) { Write-Error "expected at least 8 templates in the bundle, got $templates"; exit 1 }
          if ($recipes -lt 4) { Write-Error "expected at least 4 recipes in the bundle, got $recipes"; exit 1 }
          $envfile = Join-Path $internal "environments\running.evoenv"
          if (-not (Test-Path -LiteralPath $envfile)) { Write-Error "no running.evoenv in the bundle"; exit 1 }
          $made = Join-Path $dest "프리셋 결과\달리기.evoenv"
          New-Item -ItemType Directory -Force (Split-Path $made) | Out-Null
          & $cli preset running -o $made
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $a = (Get-FileHash -Algorithm SHA256 -LiteralPath $made).Hash
          $b = (Get-FileHash -Algorithm SHA256 -LiteralPath $envfile).Hash
          "preset: $a, shipped: $b"
          if ($a -ne $b) { Write-Error "evolab preset running differs from the shipped running.evoenv"; exit 1 }
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          & $cli bench $envfile --workers 1,2 --generations 1 --popsize 8
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $log = Join-Path $dest "cli 점검.log"
          if (Test-Path -LiteralPath $log) {
            if (-not (Select-String -LiteralPath $log -Encoding utf8 -SimpleMatch -Quiet "[통과] 새 프리셋")) {
              Write-Error "the presets self-test line is missing from the console exe log"; exit 1
            }
          } else { Write-Warning "no console self-test log (an earlier step failed)" }

      - name: Self-test windowed exe (evolab.exe, no stdout)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "진화 실험실 테스트"
          $exe = Join-Path $dest "evolab\evolab.exe"
          $log = Join-Path $dest "점검 기록.log"
          $p = Start-Process -FilePath $exe -ArgumentList @("selftest", "--log", "`"$log`"") -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(600000)) { $p.Kill($true); Write-Error "selftest timed out"; exit 1 }
          if (Test-Path $log) { Get-Content -Encoding utf8 $log } else { Write-Error "no selftest log" }
          "exit code: $($p.ExitCode)"
          $size = (Get-ChildItem -Recurse dist\evolab | Measure-Object -Sum Length).Sum / 1MB
          "dist size: {0:N0} MB" -f $size
          if ($p.ExitCode -ne 0) { exit 1 }

      # W2: 오류 보고 묶음을 Qt 없는 명령으로(한글 경로, 앞 단계의 실행 폴더를 넣음). zip에 report.txt가 있고, 체크포인트·유전자
      # (.pkl·.npz)·입력 기록(.evoplay)이 없고, 글 파일 어디에도 러너의 사용자 이름이 없어야 한다(설계 D31·D33).
      # 러너의 exe·실행 폴더는 D:\a\_temp 아래라 원래는 사용자 이름이 거의 없다: 가림을 제대로 보려고 이름을 심는다.
      #   - 실행 폴더를 홈 아래 「<사용자>_자료\run」으로 복사해 --run으로 넣는다(밑줄이 붙은 이름, 홈 경로).
      #   - 오류 기록(errors.jsonl)에 홈 경로를 JSON 이스케이프(역슬래시 두 개)와 repr + JSON(네 개) 모양으로, stderr.log에
      #     그대로(하나) 덧붙인다.
      # 앞 단계가 실패해도 exe가 있으면 돈다(기록을 모으는 단계이기도 하다).
      - name: Error report bundle with the console exe (Korean path)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "진화 실험실 테스트"
          $cli = Join-Path $dest "evolab\evolab-cli.exe"
          if (-not (Test-Path -LiteralPath $cli)) { Write-Warning "no console exe (an earlier step failed)"; exit 0 }
          $zip = Join-Path $dest "오류 보고.zip"
          $user = $env:USERNAME
          $runs = Join-Path $dest "실행 기록"
          $src = $null
          if (Test-Path -LiteralPath $runs) { $src = Get-ChildItem -LiteralPath $runs -Directory | Select-Object -First 1 }
          $argv = @("report", "--out", $zip)
          if ($src) {
            $planted = Join-Path $env:USERPROFILE "$($user)_자료\run"
            New-Item -ItemType Directory -Force (Split-Path $planted) | Out-Null
            Copy-Item -Recurse -Force -LiteralPath $src.FullName -Destination $planted
            $argv += @("--run", $planted)
          }
          $logs = Join-Path $env:LOCALAPPDATA "evolab\logs"
          New-Item -ItemType Directory -Force $logs | Out-Null
          $path = Join-Path $env:USERPROFILE "$($user)_자료\x.evoenv"
          $repr = "'" + $path.Replace("\", "\\") + "'"
          $rec = [ordered]@{ t = (Get-Date -Format s); kind = "shown"; where = "cli"; pid = 0; version = "ci";
                             message = "ci plant: $path / FileNotFoundError: [Errno 2] No such file or directory: $repr";
                             detail = "user $user at $path" }
          $utf8 = [Text.UTF8Encoding]::new($false)
          [IO.File]::AppendAllText((Join-Path $logs "errors.jsonl"), ($rec | ConvertTo-Json -Compress) + "`n", $utf8)
          [IO.File]::AppendAllText((Join-Path $logs "stderr.log"), "ci plant: $path by $user`n", $utf8)
          & $cli @argv
          if ($LASTEXITCODE -ne 0) { Write-Error "report exit code $LASTEXITCODE"; exit 1 }
          if (-not (Test-Path -LiteralPath $zip)) { Write-Error "no bundle"; exit 1 }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $names = @($z.Entries | ForEach-Object { $_.FullName })
            $names | ForEach-Object { "  $_" }
            if (-not ($names -contains "report.txt")) { Write-Error "no report.txt"; exit 1 }
            if (-not ($names -contains "manifest.json")) { Write-Error "no manifest.json"; exit 1 }
            if ($src -and -not ($names | Where-Object { $_ -like "run/*" })) { Write-Error "run folder not in bundle"; exit 1 }
            if ($names | Where-Object { $_ -match '\.(pkl|npz|evoplay)$' }) { Write-Error "checkpoint or genes in bundle"; exit 1 }
            $pattern = [regex]::Escape($user)
            $planted_seen = $false
            foreach ($entry in $z.Entries) {
              $reader = [IO.StreamReader]::new($entry.Open(), [Text.Encoding]::UTF8)
              try { $text = $reader.ReadToEnd() } finally { $reader.Dispose() }
              if ($entry.FullName -eq "report.txt") { $text }
              if ($text -match "ci plant") { $planted_seen = $true }
              if ($user -and $text -match $pattern) { Write-Error "user name in $($entry.FullName)"; exit 1 }
            }
            if (-not $planted_seen) { Write-Error "planted log lines not in bundle"; exit 1 }
          } finally {
            $z.Dispose()
          }
          "bundle: {0:N0} bytes, {1} files" -f (Get-Item -LiteralPath $zip).Length, $names.Count

      # W2: 같은 exe로 spawn한 자식이 일부러 세그폴트하면 진입점의 faulthandler가 faults.log에 치명적 오류와 함수 이름을 남겨야
      # 한다(설계 D28). 자체 점검 「기록 폴더 쓰기와 오류 보고 묶음」이 EVOLAB_SELFTEST_CRASH=1일 때만 이 시험을 한다.
      - name: Native crash is logged by the exe (spawned child segfault)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        env:
          EVOLAB_SELFTEST_CRASH: "1"
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "진화 실험실 테스트"
          $log = Join-Path $dest "crash 점검.log"
          & (Join-Path $dest "evolab\evolab-cli.exe") selftest --no-gui --log $log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Select-String -LiteralPath $log -Encoding utf8 -SimpleMatch -Quiet "marker=yes function=yes")) {
            Write-Error "crash check line missing"; exit 1
          }

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: evolab-windows
          path: dist/evolab
          retention-days: 30

      # W4: 설치 파일 둘(이번 판 lzma2/ultra64, 업그레이드 시험용 옛 2.99.0 lzma2/fast). 러너 이미지의 Inno Setup(6.7.1, 7이면 7)을
      # 쓰고, 없으면 choco로 깐다(설계 7.4 되돌릴 지점 6). 공식 Korean.isl(6.5.0+)이 컴파일러에 없으면 저장소의
      # packaging/installer/Korean.isl(공식 판을 라이선스와 함께 둔 경우)을 쓰고, 그것도 없으면 실패한다. 크기 기준 60MB(10^6 바이트).
      - name: Build installers (current and old 2.99.0)
        id: installers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 25
        shell: pwsh
        env:
          SIGN_CERT_BASE64: ${{ secrets.SIGN_CERT_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
          SIGN_TIMESTAMP_URL: ${{ vars.SIGN_TIMESTAMP_URL }}
        run: |
          function Find-Iscc {
            $candidates = @(
              (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"),
              (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"),
              (Join-Path $env:ProgramFiles "Inno Setup 7\ISCC.exe"),
              (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 7\ISCC.exe")
            )
            foreach ($c in $candidates) { if (Test-Path -LiteralPath $c) { return $c } }
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            return $null
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Host "::warning::Inno Setup is not on the runner image: installing it with choco (rollback 6)"
            choco install innosetup -y --no-progress
            $iscc = Find-Iscc
          }
          if (-not $iscc) { Write-Host "::error::ISCC.exe not found, even after choco install innosetup"; exit 1 }
          "ISCC: $iscc ($((Get-Item -LiteralPath $iscc).VersionInfo.ProductVersion))"
          $messages = @()
          $official = Join-Path (Split-Path $iscc) "Languages\Korean.isl"
          if (-not (Test-Path -LiteralPath $official)) {
            if (Test-Path -LiteralPath "packaging\installer\Korean.isl") {
              Write-Host "::warning::$official is missing: using packaging\installer\Korean.isl (rollback 6)"
              $messages = @("--messages-file", "packaging\installer\Korean.isl")
            } else {
              Write-Host "::error::$official is missing and packaging\installer\Korean.isl is not in the repository (rollback 6)"
              exit 1
            }
          }
          # 서명할 때는 Inno가 설치 파일·제거 프로그램마다 sign.ps1 -Path <파일>을 부른다($q = 따옴표, $f = 따옴표를 친 파일 이름).
          $sign = @()
          $signTool = @()
          if ($env:SIGN_ENABLED -eq "true") {
            $signScript = (Resolve-Path "packaging\installer\sign.ps1").Path
            $sign = @("--sign")
            $signTool = @('/Sevolabsign=pwsh -NoProfile -ExecutionPolicy Bypass -File $q' + $signScript + '$q -Path $f')
          }
          New-Item -ItemType Directory -Force build\installer | Out-Null
          uv run python packaging/make_installer.py --dist dist\evolab --out build\installer\evolab.iss --names-out build\installer\names.json @messages @sign
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & $iscc /Qp @signTool build\installer\evolab.iss
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::ISCC failed ($LASTEXITCODE)"; exit 1 }
          "iscc lzma2/ultra64: {0:N0} s" -f $sw.Elapsed.TotalSeconds
          uv run python packaging/make_installer.py --dist dist\evolab --out build\installer\old.iss --version-override 2.99.0 --fast @messages
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & $iscc /Qp build\installer\old.iss
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::ISCC failed for the old 2.99.0 build ($LASTEXITCODE)"; exit 1 }
          "iscc lzma2/fast (old 2.99.0): {0:N0} s" -f $sw.Elapsed.TotalSeconds
          Get-ChildItem build\installer\Output\*.exe | ForEach-Object { "{0}: {1:N0} bytes ({2:N1} MB)" -f $_.Name, $_.Length, ($_.Length / 1e6) }
          $setup = Get-Item -LiteralPath "build\installer\Output\evolab-setup-$env:VER.exe"
          if ($setup.Length -gt 60000000) { Write-Host "::error::the installer is larger than 60 MB (design W4)"; exit 1 }

      # W5: 옛 판 설치 → 덮어 설치 → 설치된 두 exe 자체 점검 → 내려 설치 거절 → 실행 중 조용한 제거 → 제거(설계 D47). 단계마다 시간.
      # 설치 기록은 evolab-setup artifact의 installer-logs에 남는다. 실행 중 조용한 제거가 기대와 다르면(Inno가 조용한 모드에서
      # AppMutex를 어떻게 다루는지는 윈도우에서만 확인) 설계 7.4 되돌릴 지점 7: -RunningUninstall을 lenient(파일만 남으면 됨)나
      # skip(사람이 P4에서 봄)으로 바꾼다.
      - name: Installer smoke test
        id: smoke
        if: ${{ !cancelled() && steps.installers.outcome == 'success' }}
        timeout-minutes: 45
        shell: pwsh
        run: >-
          ./packaging/installer_smoke.ps1
          -Setup "build\installer\Output\evolab-setup-$env:VER.exe"
          -OldSetup "build\installer\Output\evolab-setup-2.99.0.exe"
          -Version $env:VER
          -Names "build\installer\names.json"
          -LogDir "build\release\installer-logs"
          -RunningUninstall strict

      # D44: 휴대용 zip(안에 「설치 없이 쓰기.txt」)과 SHA256SUMS.txt, 릴리스 글. 설치 파일을 만들지 못했어도 zip과 체크섬은 만든다
      # (되돌릴 지점 6의 「zip·체크섬만 냄」).
      - name: Portable zip and checksums
        id: release_files
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 10
        shell: pwsh
        run: |
          $setup = "build\installer\Output\evolab-setup-$env:VER.exe"
          $argv = @("--dist", "dist\evolab", "--out", "build\release", "--version", $env:VER)
          if (Test-Path -LiteralPath $setup) {
            $argv += @("--setup", $setup)
          } else {
            Write-Host "::warning::no installer: the release files are the portable zip and its checksum only (rollback 6)"
          }
          uv run python packaging/installer/release_files.py @argv
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Content build\release\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.release_files.outcome == 'success' }}
        with:
          name: evolab-setup
          path: build/release/
          if-no-files-found: error
          retention-days: 30

      # W6: Media Foundation vtable 번호·GUID 표(src/evolab/app/export/mf_win.py)를 러너의 SDK 헤더로 컴파일한 C 프로그램 출력과 비교.
      # vcvars64.bat를 부르는 명령은 따옴표가 겹쳐 PowerShell에서 바로 넘기기 어려워 임시 .cmd 파일로 돌린다.
      - name: Media Foundation ABI table (SDK headers)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { Write-Host "::error::no Visual Studio with the C++ tools on the runner"; exit 1 }
          New-Item -ItemType Directory -Force build | Out-Null
          $bat = Join-Path $env:RUNNER_TEMP "mf_abi_build.cmd"
          @(
            "@echo off",
            "call `"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul || exit /b 1",
            "cl /nologo /W3 /Zc:preprocessor packaging\ci\mf_abi.c /Febuild\mf_abi.exe /Fobuild\mf_abi.obj mfuuid.lib mfplat.lib mfreadwrite.lib ole32.lib || exit /b 1",
            "build\mf_abi.exe > build\mf_abi.json || exit /b 1"
          ) | Set-Content -Encoding ascii -LiteralPath $bat
          & cmd.exe /d /c $bat
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::building or running packaging\ci\mf_abi.c failed"; exit 1 }
          Get-Content build\mf_abi.json
          # tests/test_mf_abi.py는 EVOLAB_MF_ABI(또는 conftest가 등록했을 때만 --mf-abi)로 받은 JSON과 표를 비교한다.
          $env:EVOLAB_MF_ABI = (Resolve-Path "build\mf_abi.json").Path
          uv run pytest -q tests/test_mf_abi.py

      # W8(정보만): 러너(윈도우 서버)에는 Media Foundation이 기본으로 없다. 기능 설치를 시도하고 video-probe 결과를 기록한다.
      - name: Try Media Foundation on the runner (information only)
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: |
          Install-WindowsFeature Server-Media-Foundation | Format-List
          uv run evolab video-probe

      # W7: 앞 단계의 학습 실행으로 exe 내보내기 넷(한글 경로) → 내장 MP4를 테스트 복호기로 확인. 결과는 evolab-exports artifact로
      # 올려 사람이 폰에서 열어 본다(P5·P6). 명령마다 걸린 시간과 크기를 찍는다.
      - name: Exports with the console exe (Korean path)
        id: exports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "진화 실험실 테스트"
          $cli = Join-Path $dest "evolab\evolab-cli.exe"
          $runs = Join-Path $dest "실행 기록"
          if (-not (Test-Path -LiteralPath $cli) -or -not (Test-Path -LiteralPath $runs)) {
            Write-Host "::error::no console exe or run folder in the Korean path (an earlier step failed)"; exit 1
          }
          $run = (Get-ChildItem -LiteralPath $runs -Directory | Select-Object -First 1).FullName
          $out = Join-Path $dest "내보내기"
          New-Item -ItemType Directory -Force $out | Out-Null
          function Invoke-Export([string]$Name, [string[]]$Options) {
            $file = Join-Path $out $Name
            $sw = [Diagnostics.Stopwatch]::StartNew()
            & $cli export $run @Options --out $file
            $code = $LASTEXITCODE
            $size = if (Test-Path -LiteralPath $file) { (Get-Item -LiteralPath $file).Length } else { 0 }
            "{0}: exit code {1}, {2:N1} s, {3:N0} bytes" -f $Name, $code, $sw.Elapsed.TotalSeconds, $size
            if ($code -ne 0) { exit 1 }
          }
          Invoke-Export "챔피언.mp4" @("--format", "mp4", "--encoder", "builtin")
          Invoke-Export "1세대와 지금.mp4" @("--format", "mp4", "--what", "versus", "--size", "small")
          Invoke-Export "챔피언.html" @("--format", "html")
          Invoke-Export "챔피언.gif" @("--format", "gif")
          & $cli video-probe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          uv run python tests\h264_subset_decoder.py (Join-Path $out "챔피언.mp4")
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # 9.3 기준 4(exe의 내장 MP4가 원본과 같음): 프레임 수가 frames.frame_count(같은 실행·같은 옵션의 작업)와 같고,
          # 같은 실행을 소스(uv run evolab export)로 같은 옵션으로 만든 파일과 바이트까지 같다(MP4에 시각·날짜가 없다).
          $exeMp4 = Join-Path $out "챔피언.mp4"
          $srcMp4 = Join-Path $env:RUNNER_TEMP "w7_source.mp4"
          uv run evolab export $run --format mp4 --encoder builtin --out $srcMp4
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::the source export of the same run failed"; exit 1 }
          $check = Join-Path $env:RUNNER_TEMP "w7_frames.py"
          @'
          import os
          import sys
          from pathlib import Path

          from evolab.app.export import job as J
          from evolab.app.export import mp4
          from evolab.app.export.frames import frame_count

          job = J.job_from_run(Path(os.environ["W7_RUN"]), "mp4", generation=None, what="champion", size="medium",
                               camera="fixed", encoder="builtin")
          want = frame_count(job)
          got = [mp4.read_info(os.environ[k])["frames"] for k in ("W7_EXE_MP4", "W7_SRC_MP4")]
          print(f"frames: exe {got[0]}, source {got[1]}, expected {want}")
          sys.exit(0 if got == [want, want] else 1)
          '@ | Set-Content -Encoding utf8 -LiteralPath $check
          $env:W7_RUN = $run
          $env:W7_EXE_MP4 = $exeMp4
          $env:W7_SRC_MP4 = $srcMp4
          uv run python $check
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::the exe MP4 does not have the expected frame count"; exit 1 }
          $exeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exeMp4).Hash
          $srcHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $srcMp4).Hash
          "SHA-256: exe $exeHash, source $srcHash"
          if ($exeHash -ne $srcHash) { Write-Host "::error::the exe MP4 differs from the source MP4 of the same run"; exit 1 }

      # W9: 폰 재생 파일을 헤드리스 Edge로 열어 재생기가 떴는지: 오프라인 file://에서 인라인 스크립트가 돌아 캔버스를 만들고
      # id="player"를 보이고 스크립트 없을 때의 끝 장면 그림 id="poster"를 숨겼는지(재생기는 이것을 첫 애니메이션 프레임 전에,
      # 스크립트가 도는 그 자리에서 한다). msedge.exe는 창(GUI) 프로그램이라 PowerShell은 `& $edge ...`가 제 파이프라인의 끝이면
      # 출력을 변수에 받더라도 기다리지도 stdout을 읽지도 않는다(NativeCommandProcessor: _isRunningInBackground = isWindowsApplication).
      # v3.1 첫 CI는 그래서 0.4초 만에 빈 글을 받아 「no <canvas>」로 멈췄고 Edge의 stderr는 그 뒤에 찍혔다. 그래서 Start-Process로
      # stdout·stderr를 파일로 받고 브라우저 프로세스가 끝나기를 기다린다. DOM과 stderr는 「W9 Edge *.log」(evolab-selftest-logs),
      # 폰 화면 크기(390x844) 스크린숏은 내보내기 폴더(evolab-exports)에 남는다(스크린숏은 정보용: 판정은 DOM으로만).
      - name: Phone file opens in headless Edge
        if: ${{ !cancelled() && steps.exports.outcome == 'success' }}
        timeout-minutes: 5
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "진화 실험실 테스트"
          $file = Join-Path $dest "내보내기\챔피언.html"
          if (-not (Test-Path -LiteralPath $file)) { Write-Host "::error::no phone file $file (the export step did not write it)"; exit 1 }
          $edge = @(
            (Join-Path ${env:ProgramFiles(x86)} "Microsoft\Edge\Application\msedge.exe"),
            (Join-Path $env:ProgramFiles "Microsoft\Edge\Application\msedge.exe")
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $edge) { Write-Host "::error::Microsoft Edge not found"; exit 1 }
          "Edge {0}: {1}" -f (Get-Item -LiteralPath $edge).VersionInfo.ProductVersion, $edge
          $url = ([Uri]$file).AbsoluteUri
          function Read-Shared([string]$Path) {
            # Edge의 자식 프로세스가 아직 파일을 열어 두었어도 읽는다(쓰기 공유)
            if (-not (Test-Path -LiteralPath $Path)) { return "" }
            $fs = [IO.File]::Open($Path, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::ReadWrite)
            try { return [IO.StreamReader]::new($fs, [Text.UTF8Encoding]::new($false)).ReadToEnd() } finally { $fs.Dispose() }
          }
          function Invoke-Edge([string]$Name, [string[]]$More) {
            # Start-Process는 인수를 따옴표 없이 잇는다: 경로는 위 창 exe 단계처럼 따옴표로 감싼다(주소는 %로 바뀌어 빈칸이 없다)
            $edgeProfile = Join-Path $env:RUNNER_TEMP "w9-edge-$Name"
            $argv = @("--headless=new", "--disable-gpu", "--no-first-run", "--no-default-browser-check",
                      "`"--user-data-dir=$edgeProfile`"", "--virtual-time-budget=3000") + $More + @($url)
            $out = Join-Path $dest "W9 Edge $Name.log"
            $err = Join-Path $dest "W9 Edge $Name stderr.log"
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $edge -ArgumentList $argv -NoNewWindow -PassThru -RedirectStandardOutput $out -RedirectStandardError $err
            $null = $p.Handle
            $done = $p.WaitForExit(90000)
            if (-not $done) { try { $p.Kill($true) } catch { } }
            $code = if ($done) { $p.ExitCode } else { "none (killed after 90 s)" }
            Write-Host ("Edge {0}: exit code {1}, {2:N1} s" -f $Name, $code, $sw.Elapsed.TotalSeconds)
            return @{ Out = $out; Err = $err }
          }
          $run = Invoke-Edge "DOM" @("--dump-dom")
          $dom = Read-Shared $run.Out
          # msedge.exe가 브라우저를 다른 프로세스에 넘기고 먼저 끝나도 DOM이 끝까지 쓰이도록 잠깐 더 기다린다(보통은 바로 지나감)
          $deadline = [DateTime]::UtcNow.AddSeconds(15)
          while ($dom -notmatch '</html>\s*$' -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 250; $dom = Read-Shared $run.Out }
          $shot = Join-Path $env:RUNNER_TEMP "w9-edge-screenshot.png"
          Remove-Item -LiteralPath $shot -Force -ErrorAction SilentlyContinue
          $null = Invoke-Edge "screenshot" @("--window-size=390,844", "`"--screenshot=$shot`"")
          try { Copy-Item -ErrorAction Stop -LiteralPath $shot -Destination (Join-Path $dest "내보내기\W9 Edge 390x844.png") }
          catch { Write-Host "::warning::no Edge screenshot (information only): $_" }
          function Stop-W9([string]$Message) {
            Write-Host "::error::$Message"
            Write-Host ("--- first 40 lines of the DOM Edge wrote ({0:N0} characters; long lines cut at 200) ---" -f $dom.Length)
            $dom -split "`n" | Select-Object -First 40 | ForEach-Object { Write-Host ($_.Substring(0, [Math]::Min(200, $_.Length))) }
            Write-Host "--- last 20 lines of Edge stderr ---"
            (Read-Shared $run.Err) -split "`n" | Select-Object -Last 20 | ForEach-Object { Write-Host $_ }
            exit 1
          }
          if ($dom -notmatch '<canvas\b') { Stop-W9 "no <canvas> in the page Edge rendered (the player script did not run)" }
          $player = [regex]::Match($dom, '<[^>]*\bid="player"[^>]*>')
          if (-not $player.Success -or $player.Value -match '\shidden(\s|=|/|>)') { Stop-W9 "the player is missing or still hidden: $($player.Value)" }
          $poster = [regex]::Match($dom, '<[^>]*\bid="poster"[^>]*>')
          if (-not $poster.Success) { Stop-W9 "no element with id=poster" }
          if ($poster.Value -notmatch '\shidden(\s|=|/|>)') {
            Stop-W9 ("the end-scene picture is still visible after the player started: " + $poster.Value.Substring(0, [Math]::Min(200, $poster.Value.Length)))
          }
          "phone file: canvas present, player shown, poster hidden ({0:N0} characters of DOM)" -f $dom.Length

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.exports.outcome != 'skipped' }}
        with:
          name: evolab-exports
          path: ${{ runner.temp }}/진화 실험실 테스트/내보내기/
          if-no-files-found: warn
          retention-days: 30

      # 상태 폴더의 기록(errors.jsonl: 명령줄의 잡히지 않은 예외와 traceback, faults.log, 창 exe의 stderr.log, 자체 점검이
      # 임시 폴더에서 옮겨 둔 selftest-*-errors.jsonl)을 올릴 곳으로 복사하고 오류 기록 끝을 로그에 보인다.
      - name: Collect state-folder logs
        if: always()
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "진화 실험실 테스트\state-logs"
          New-Item -ItemType Directory -Force $d | Out-Null
          $logs = Join-Path $env:LOCALAPPDATA "evolab\logs"
          if (Test-Path -LiteralPath $logs) { Copy-Item -Force -ErrorAction SilentlyContinue (Join-Path $logs "*") $d }
          Get-ChildItem -LiteralPath $d | ForEach-Object { "  $($_.Name) ($($_.Length) bytes)" }
          $errors = Join-Path $d "errors.jsonl"
          if (Test-Path -LiteralPath $errors) { Get-Content -Encoding utf8 -Tail 20 -LiteralPath $errors }

      # 점검 기록(설계 M1의 안내 초, W2·W3)과 오류 보고 묶음, 상태 폴더 기록. 앞 단계가 실패해도 남은 기록을 올린다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evolab-selftest-logs
          path: |
            selftest-dev.log
            tour-full.log
            ${{ runner.temp }}/진화 실험실 테스트/*.log
            ${{ runner.temp }}/진화 실험실 테스트/오류 보고.zip
            ${{ runner.temp }}/진화 실험실 테스트/state-logs/
            build/installer/*.iss
            build/installer/names.json
            build/mf_abi.json
          if-no-files-found: warn
          retention-days: 30

  # W10: 태그 v*(예: v3.1.0)를 올리면 tests·package가 모두 성공한 뒤 설치 파일·휴대용 zip·SHA256SUMS.txt를 GitHub 릴리스에 올린다.
  # 제목·본문은 release_files.py가 strings.py에서 만든 release-title.txt·release-notes.md(설치 안내 + 체크섬). 같은 태그로 다시
  # 돌면 파일만 바꿔 올린다. 받을 곳(저장소 공개 여부)은 열린 질문 Q2: 기본은 이 릴리스와 Actions artifact.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [tests, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: evolab-setup
          path: release

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          create_args=(--verify-tag)
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            # 수동 실행(release 입력): 태그 이름은 묶인 프로그램의 버전에서 나오고, 이 커밋에 새로 만든다.
            if [ ! -f release/release-title.txt ]; then echo "::error::missing release/release-title.txt"; exit 1; fi
            TAG="v$(head -n 1 release/release-title.txt | awk '{print $NF}')"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::cannot read the program version from release-title.txt ($TAG)"; exit 1; fi
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::the release $TAG already exists (a manual run never replaces a release: raise the program version first)"; exit 1
            fi
            create_args=(--target "$GITHUB_SHA")
          fi
          version="${TAG#v}"
          setup="release/evolab-setup-${version}.exe"
          portable="release/evolab-${version}-portable.zip"
          for f in "$portable" release/SHA256SUMS.txt release/release-notes.md release/release-title.txt; do
            if [ ! -f "$f" ]; then echo "::error::missing $f (the tag $TAG must match the program version)"; exit 1; fi
          done
          (cd release && sha256sum -c SHA256SUMS.txt)
          files=("$portable" release/SHA256SUMS.txt)
          # package가 성공했는데 설치 파일이 없는 것은 설치 단계를 일부러 뺀 때뿐이다(되돌릴 지점 6: zip·체크섬만 냄).
          if [ -f "$setup" ]; then files=("$setup" "${files[@]}"); else echo "::warning::no installer in this release (rollback 6)"; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" "${create_args[@]}" \
              --title "$(head -n 1 release/release-title.txt)" --notes-file release/release-notes.md
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size)")'
